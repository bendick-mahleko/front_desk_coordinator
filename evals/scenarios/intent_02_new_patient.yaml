name: intent_02_new_patient
kind: intent
spec: "spec §5 — I'm a new patient"
description: >-
  Always check before creating, to avoid a duplicate. The turn count reflects
  spec §4.1: the assistant collects one item at a time and confirms spelling
  before submitting, so a three-turn script never reaches the registration call.
turns:
  - "Hello, I'm a new patient and I'd like to register."
  - "My name is Ada Nwosu."
  - "My date of birth is 1990-01-01."
  - "My mobile is 206-555-0999."
  - "No email, and my insurance is BlueRidge PPO."
  - "Yes, that's all spelled correctly — please go ahead and register me."
  - "Yes, confirmed."
expect_tools: [check_patient_exists, create_new_patient_record]
expect_status: registered
